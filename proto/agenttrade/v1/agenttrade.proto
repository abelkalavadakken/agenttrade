syntax = "proto3";

package agenttrade.v1;

// Service exposed by the Rust Core to Python Agents
service AgentCoreService {
  rpc GetState(GetStateRequest) returns (GetStateResponse);
  rpc SubmitIntent(SubmitIntentRequest) returns (SubmitIntentResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream MarketEvent);
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse);
}

// ---------------- Metadata & Types ----------------
message Instrument {
  string venue = 1;
  string symbol = 2;
  int32 price_scale = 3;  // e.g., 8 for 1e-8
  int32 qty_scale = 4;
  int64 min_tick_size = 5;
  int64 min_lot_size = 6;
}

// ---------------- Enums ----------------
enum OrderSide {
  SIDE_UNSPECIFIED = 0;
  BUY = 1;
  SELL = 2;
}

enum IntentType {
  INTENT_UNSPECIFIED = 0;
  PLACE = 1;
  CANCEL = 2;
  FLATTEN = 3;
  NOOP = 4;
  ALLOCATE = 5;
  TUNE = 6;
  CONFIRM_SETUP = 7;
  REJECT_SETUP = 8;
  FLATTEN_ALL = 9;
}

enum TimeInForce {
  TIF_UNSPECIFIED = 0;
  GTC = 1; // Good Til Canceled
  IOC = 2; // Immediate or Cancel
  FOK = 3; // Fill or Kill
}

enum RiskDecision {
  DECISION_UNSPECIFIED = 0;
  APPROVED = 1;
  REJECTED = 2;
}

enum RejectionCode {
  NONE = 0;
  STALE_STATE = 1;
  EXCEEDS_MAX_LEVERAGE = 2;
  EXCEEDS_SINGLE_LOSS_LIMIT = 3;
  INVALID_TICK_SIZE = 4;
  VENUE_DISCONNECTED = 5;
  KILL_SWITCH_ACTIVE = 6;
  RATE_LIMIT_EXCEEDED = 7;
  MISSING_STOP = 8;
  PRICE_OUT_OF_BAND = 9;
  INVALID_INTENT = 10;
  INSTRUMENT_HALTED = 11;
  PARAM_OUT_OF_BOUNDS = 12;
  ALLOCATION_LIMIT = 13;
  MISSING_EXIT_PLAN = 14;
}

// ---------------- RPC Payloads ----------------
message ListInstrumentsRequest {}

message ListInstrumentsResponse {
  repeated Instrument instruments = 1;
}

message GetStateRequest {
  string venue = 1;
  string symbol = 2;
}

message Position {
  int64 net_qty = 1; // Positive = Long, Negative = Short, 0 = Flat
  int64 average_entry_price = 2;
  int64 unrealized_pnl = 3;
  int64 realized_pnl = 4;
}

message Bar {
  int64 open = 1;
  int64 high = 2;
  int64 low = 3;
  int64 close = 4;
  int64 volume = 5;
  int64 close_ns = 6;
  bool gap = 7;
}

message MarketFeatures {
  double rsi = 1; 
  double ema_fast = 2;
  double ema_slow = 3;
  int64 order_flow_imbalance = 4;
  repeated Bar bars = 5;          // closed, oldest first, up to 15
  Bar forming = 6;
  uint32 bars_since_update = 7;   // 0 when fresh
  bool volume_available = 8;
  bool book_stale = 9;
}

message GetStateResponse {
  uint64 sequence_id = 1;
  int64 timestamp_ns = 2;
  string venue = 3;
  string symbol = 4;
  int64 bid = 5;
  int64 ask = 6;
  Position current_position = 7;
  MarketFeatures features = 8;
  int64 available_equity = 9;
  repeated StrategyState strategies = 10;
}

message SubmitIntentRequest {
  string intent_id = 1;         
  string agent_id = 2;          
  uint64 source_sequence_id = 3; 
  int64 generated_time_ns = 4;
  IntentType intent_type = 5;
  string venue = 6;
  string symbol = 7;
  OrderSide side = 8;
  TimeInForce time_in_force = 9;
  int64 target_price = 10;
  int64 stop_loss = 11; // Mandatory for PLACE intents
  int64 quantity = 12;
  uint64 target_order_id = 13; // CANCEL only: the order to cancel
  Allocation allocation = 14;   // ALLOCATE
  Tune tune = 15;               // TUNE
  SetupDecision setup = 16;     // CONFIRM_SETUP, REJECT_SETUP
  int64 take_profit = 17;       // discretionary PLACE: required exit
}

// ---------------- Strategies ----------------
enum OnDisable {
  ON_DISABLE_UNSPECIFIED = 0;
  ON_DISABLE_FLATTEN = 1;
  ON_DISABLE_HOLD = 2;
}

enum StrategyMode {
  STRATEGY_MODE_UNSPECIFIED = 0;
  AUTONOMOUS = 1;
  GATED = 2;
}

message Allocation {
  string strategy_id = 1;
  bool enabled = 2;
  int64 size_multiplier_bps = 3; // 10_000 = 1x
  OnDisable on_disable = 4;
}

message Tune {
  string strategy_id = 1;
  string param = 2;
  int64 value = 3;
}

message SetupDecision {
  string strategy_id = 1;
  uint64 setup_id = 2;
  int64 size_multiplier_bps = 3; // CONFIRM only; stacks on the allocation multiplier
}

message Param {
  string name = 1;
  int64 value = 2;
  int64 min = 3;
  int64 max = 4;
}

message ProposedOrder {
  OrderSide side = 1;
  int64 price = 2;
  int64 stop = 3;
  int64 qty = 4;
  TimeInForce time_in_force = 5;
  string reason = 6;
}

message StrategyCounters {
  uint64 setups = 1;
  uint64 confirmed = 2;
  uint64 rejected = 3;
  uint64 expired = 4;
  uint64 orders_sent = 5;
  uint64 orders_rejected_by_gate = 6;
}

message StrategyState {
  string id = 1;
  StrategyMode mode = 2;
  bool enabled = 3;
  int64 size_multiplier_bps = 4;
  bool setup_active = 5;
  uint64 pending_setup_id = 6;   // 0 when none
  ProposedOrder pending_order = 7;
  repeated Param params = 8;
  int64 net_qty = 9;
  int64 realized_pnl = 10;
  StrategyCounters counters = 11;
}

message SubmitIntentResponse {
  string intent_id = 1;
  RiskDecision decision = 2;
  RejectionCode rejection_code = 3;
  string rejection_reason = 4;
  uint64 executed_order_id = 5; // 0 if rejected
  int64 processed_time_ns = 6;
}

message StreamEventsRequest {
  string venue = 1;
  string symbol = 2;
}

enum WakeReason {
  WAKE_REASON_UNSPECIFIED = 0;
  TIMER = 1;
  REGIME_SHIFT = 2;
  SETUP_ACTIVE = 3;
  DRAWDOWN_LIMIT = 4;
  VENUE_STATUS = 5;
  OPERATOR = 6;
}

message SetupActive {
  string strategy_id = 1;
  uint64 setup_id = 2;
  ProposedOrder order = 3;
  GetStateResponse snapshot = 4;
  int64 ttl_ms = 5;
}

message Wake {
  WakeReason reason = 1;
  SetupActive setup = 2;  // SETUP_ACTIVE only
  string detail = 3;      // VENUE_STATUS, OPERATOR: free text
}

message RegimeShiftPayload {
  string previous_regime = 1;
  string new_regime = 2;
  double confidence = 3;
}

// ---------------- Tape records (crates/api writes, bin/replay reads) ----------------
enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  ORDER_PENDING_NEW = 1;
  ORDER_OPEN = 2;
  ORDER_PARTIALLY_FILLED = 3;
  ORDER_FILLED = 4;
  ORDER_PENDING_CANCEL = 5;
  ORDER_CANCELED = 6;
  ORDER_REJECTED = 7;
}

message OrderTransition {
  uint64 order_id = 1;
  OrderState from = 2;
  OrderState to = 3;
  string reason = 4;
  int64 ns = 5;
}

message Fill {
  uint64 order_id = 1;
  OrderSide side = 2;
  int64 price = 3;
  int64 qty = 4;
  bool thin_book = 5;
  int64 ns = 6;
  string strategy_id = 7;
}

message PositionUpdate {
  Position position = 1;
  int64 equity = 2;
  int64 ns = 3;
}

message ExecEvent {
  oneof event {
    OrderTransition transition = 1;
    Fill fill = 2;
    PositionUpdate position = 3;
  }
}

message StateHash {
  uint64 sequence_id = 1;
  uint64 event_count = 2;
  bytes hash = 3;
}

message MarketEvent {
  uint64 sequence_id = 1;
  int64 timestamp_ns = 2;
  string venue = 3;
  string symbol = 4;
  oneof event {
    int64 mid_price_update = 5;
    Position position_update = 6;
    RegimeShiftPayload regime_shift = 7;
    Wake wake = 8;
  }
}
