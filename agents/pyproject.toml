[project]
name = "agenttrade-agents"
version = "0.1.0"
description = "AgentTrade agent layer: observer, analyst, trader, reviewer"
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk>=0.2.152"]

[project.scripts]
agenttrade-agents = "agenttrade_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenttrade_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
